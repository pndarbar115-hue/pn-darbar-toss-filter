name: Build PN DARBAR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "KEYSTORE_BASE64 secret missing"; exit 1; }
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > keystore/pn-darbar-release.jks
          test -s keystore/pn-darbar-release.jks

      - name: Build signed Release APK
        env:
          KEYSTORE_FILE: keystore/pn-darbar-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: pndarbar
        run: |
          test -n "$KEYSTORE_PASSWORD" || { echo "KEYSTORE_PASSWORD secret missing"; exit 1; }
          gradle assembleRelease

      - name: Verify APK signature
        run: |
          apksigner verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: PN-DARBAR-Signed-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
